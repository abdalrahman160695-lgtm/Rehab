<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>متتبع التأهيل والتمرين</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f3f6f5;--card:#fff;--text:#14201f;--muted:#5b6b69;--line:#dbe4e2;
  --primary:#0f766e;--primary-ink:#fff;--primary-soft:#e0f2ef;
  --danger:#b42318;--danger-soft:#fdecea;--warn:#a15c07;--warn-soft:#fff4e0;--ok:#067647;--ok-soft:#e3f6ec;
  --c1:#0f766e;--c2:#c2410c;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514;--card:#16201f;--text:#e6efed;--muted:#9bb0ad;--line:#2a3a38;
    --primary:#2dd4bf;--primary-ink:#06201d;--primary-soft:#12302d;
    --danger:#ff8a80;--danger-soft:#3a1816;--warn:#ffc56b;--warn-soft:#3a2a10;--ok:#6ee7a8;--ok-soft:#10301f;
    --c1:#2dd4bf;--c2:#fb923c;--shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:16px;line-height:1.55}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--primary);color:var(--primary-ink);padding:10px 0;padding-top:calc(10px + env(safe-area-inset-top))}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:17px;margin:0;font-weight:700}
.chip{display:inline-block;background:rgba(255,255,255,.22);color:inherit;border-radius:99px;padding:2px 10px;font-size:13px;white-space:nowrap}
main{padding-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14.5px;margin:12px 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px 14px;min-height:44px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
.btn-d{background:var(--danger);color:#fff;border-color:var(--danger);font-weight:700}
.btn-s{padding:7px 10px;min-height:36px;font-size:14px}
.btn-block{width:100%}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
textarea{min-height:80px}
input[type=range]{width:100%;accent-color:var(--primary)}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--primary);flex:none}
.alert{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14.5px;border:1px solid}
.a-danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.a-warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.a-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.a-info{background:var(--primary-soft);border-color:var(--primary);color:var(--text)}
.alert b{display:block;margin-bottom:2px}
.alert ul{margin:4px 0 0;padding-inline-start:20px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.kpi{text-align:center;background:var(--bg);border-radius:12px;padding:10px 4px}
.kpi b{display:block;font-size:22px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;background:var(--primary-soft);color:var(--text);margin-inline-start:4px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--danger-soft);color:var(--danger)}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:0}
nav.tabs button{border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:7px 0;color:var(--muted);min-height:58px}
nav.tabs button.on{color:var(--primary);font-weight:700}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{white-space:nowrap;padding:7px 13px;min-height:38px;font-size:14px}
.seg button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
/* workout */
.ex{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card);overflow:hidden}
.ex.cur{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.ex.done{opacity:.8}
.ex-h{display:flex;gap:10px;align-items:center;padding:12px;cursor:pointer}
.ex-n{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ex.done .ex-n{background:var(--ok);color:#fff}
.ex-b{padding:0 12px 12px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);border-radius:12px;padding:6px;margin-bottom:8px}
.figs div{text-align:center;font-size:11px;color:var(--muted)}
svg.fig{width:100%;height:auto;max-height:120px;direction:ltr}
.fig .body polyline{fill:none;stroke:var(--primary);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.fig .body circle{fill:var(--primary)}.fig .floor{stroke:var(--line);stroke-width:2}
.fig .prop{stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.setrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.setrow .lbl{font-size:13px;min-width:64px}
.setrow .act{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.setrow.done{background:var(--ok-soft);border-radius:8px;padding:8px}
.setrow input{min-height:40px;text-align:center}
.timer-big{font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;min-width:84px;text-align:center}
#restbar{position:fixed;inset-inline:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:29;display:none}
#restbar .in{max-width:640px;margin:0 auto 8px;padding:10px 14px;background:var(--primary);color:var(--primary-ink);border-radius:14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#restbar.end .in{background:var(--warn);color:#fff;animation:pulse .8s infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
#restbar button{background:rgba(255,255,255,.2);color:inherit;border-color:transparent;min-height:38px;padding:6px 10px}
#restbar .tm{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;flex:1;text-align:center}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;max-width:608px;margin:0 auto;background:#222;color:#fff;padding:11px 14px;border-radius:12px;font-size:14.5px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.stat:last-child{border:0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
.up{color:var(--ok)}.down{color:var(--danger)}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}
.chart{width:100%;height:auto;direction:ltr}
.chart text{fill:var(--muted);font-size:10px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-inline-end:4px;border-radius:2px}
.hide{display:none!important}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;background:#fff;font-size:12px;padding:8mm}
  #print table{width:100%;border-collapse:collapse;margin-bottom:12px}
  #print th,#print td{border:1px solid #999;padding:3px 5px;text-align:start;font-size:11px}
  #print h1{font-size:18px}#print h2{font-size:14px;margin:14px 0 4px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>متتبع التأهيل والتمرين</h1><span class="chip" id="phaseChip"></span></div></header>
<div class="wrap"><main id="view"></main></div>
<div id="restbar"><div class="in"><span class="small">راحة</span><button data-act="restAdj" data-d="-15">−15</button><span class="tm" id="restTime">0:00</span><button data-act="restAdj" data-d="15">+15</button><button data-act="restSkip">تخطي</button></div></div>
<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<div id="print"></div>
<script>
'use strict';
/* =====================================================================
   1) أدوات عامة
   ===================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const LOC='ar-EG-u-nu-latn';
const fmtD=s=>parseD(s).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'});
const fmtS=s=>parseD(s).toLocaleDateString(LOC,{day:'numeric',month:'short'});
const weekStart=s=>{const d=parseD(s);const k=(d.getDay()+1)%7;return addDays(s,-k)}; // السبت بداية الأسبوع
const mmss=t=>{t=Math.max(0,Math.round(t));return `${Math.floor(t/60)}:${pad(t%60)}`};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const r1=n=>n==null?'—':(Math.round(n*10)/10).toString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* =====================================================================
   2) مكتبة التمارين (الاسم بالعربية + الإنجليزية)
   unit: reps | sec | breaths | min    minPhase: أقل مرحلة مناسبة
   ===================================================================== */
const LIB={
 warmup:{ar:'إحماء: مشي خفيف أو عجلة',en:'Light Walk / Bike',unit:'min',noRest:true,minPhase:1,cue:'وتيرة مريحة تستطيع معها الكلام. لا تقفل الركبة اليسرى للخلف أثناء المشي.'},
 breathing:{ar:'التنفس الحجابي',en:'Diaphragmatic Breathing',unit:'breaths',noRest:true,minPhase:1,cue:'تنفّس ببطء عبر الأنف ودع البطن ترتفع بلطف. لا تشدّ عضلات قاع الحوض بقوة.'},
 pelvicTilt:{ar:'إمالة الحوض',en:'Pelvic Tilts',unit:'reps',minPhase:1,cue:'حركة صغيرة وبطيئة بلا ألم، مع تنفس منتظم.'},
 heelSlide:{ar:'انزلاق الكعب',en:'Heel Slides',unit:'reps',perSide:true,minPhase:1,cue:'اسحب الكعب نحو الجسم ثم مدّه ببطء دون قفل الركبة بقوة.',knee:true},
 bridge:{ar:'جسر الأرداف',en:'Glute Bridge',unit:'reps',minPhase:1,cue:'ارفع الحوض بتحكم حتى خط مستقيم من الكتف للركبة، وتجنّب تقوّس الظهر.'},
 sitStand:{ar:'قيام من الجلوس (كرسي مرتفع)',en:'Sit-to-Stand (high chair)',unit:'reps',minPhase:1,cue:'وزّع الحمل على الرجلين بالتساوي وقف دون قفل الركبة اليسرى للخلف.',knee:true},
 boxSquat:{ar:'قيام/سكوات على صندوق',en:'Sit-to-Stand / Box Squat',unit:'reps',minPhase:2,cue:'مدى مريح فقط، لا سكوات عميق. وزّع الحمل بالتساوي.',knee:true,fig:'sitStand'},
 hinge:{ar:'ثني الورك بوزن الجسم',en:'Hip Hinge (bodyweight)',unit:'reps',minPhase:1,cue:'ادفع الحوض للخلف بظهر محايد وركبتين مرنتين (غير مقفولتين).',knee:true},
 hingeDB:{ar:'ثني الورك بدامبلز خفيفة',en:'Hip Hinge with Light Dumbbells',unit:'reps',weighted:true,minPhase:2,cue:'وزن خفيف. ركبتان مرنتان وظهر محايد.',knee:true,fig:'hinge'},
 calfRaise:{ar:'رفع السمانة (بدعم)',en:'Supported Calf Raises',unit:'reps',minPhase:1,cue:'امسك دعامة، ارفع ببطء وانزل ببطء، دون قفل الركبة اليسرى للخلف.',knee:true},
 deadBugEasy:{ar:'ديد باغ سهل',en:'Easy Dead Bug',unit:'reps',perSide:true,minPhase:1,cue:'حافظ على ثبات الجذع، وحرّك طرفاً واحداً بمدى صغير.',fig:'deadBug'},
 deadBug:{ar:'ديد باغ',en:'Dead Bug',unit:'reps',perSide:true,minPhase:2,cue:'ظهر ثابت على الأرض، حركة بطيئة متحكَّم بها.'},
 slBalance:{ar:'توازن على رجل واحدة (بدعم)',en:'Supported Single-Leg Balance',unit:'sec',perSide:true,minPhase:1,cue:'امسك الدعامة بخفة. وزّع الوزن على القدم كلها، وتجنّب قفل الركبة للخلف.',knee:true},
 chestPress:{ar:'ضغط الصدر',en:'Chest Press',unit:'reps',weighted:true,minPhase:1,cue:'وزن خفيف إلى متوسط بحيث تبقى الشدة حوالي 5/10.'},
 seatedRow:{ar:'سحب جالس',en:'Seated Row',unit:'reps',weighted:true,minPhase:1,cue:'اسحب بتحكم مع ثبات الكتفين والجذع.'},
 latPulldown:{ar:'سحب علوي',en:'Lat Pulldown',unit:'reps',weighted:true,minPhase:1,cue:'اسحب نحو أعلى الصدر دون تقوّس الظهر.'},
 hamCurl:{ar:'ثني الهامسترنج الخفيف',en:'Light Hamstring Curl',unit:'reps',weighted:true,minPhase:2,cue:'وزن خفيف، حركة بطيئة، ولا تقفل الركبة عند التمديد.',knee:true},
 birdDog:{ar:'بيرد دوغ',en:'Bird Dog',unit:'reps',perSide:true,minPhase:2,cue:'حافظ على ثبات الحوض والظهر أثناء مدّ الذراع والرجل المعاكستين.'},
 stepUp:{ar:'صعود درجة منخفضة',en:'Low Step-Ups',unit:'reps',perSide:true,minPhase:2,gate:'stepups',cue:'درجة منخفضة فقط. ادفع بالرجل التي على الدرجة وتجنّب قفل الركبة اليسرى.',knee:true},
 squat:{ar:'سكوات بمدى متدرج',en:'Graded-Range Squat',unit:'reps',minPhase:3,cue:'مدى صغير إلى متوسط بلا ألم. لا سكوات عميق.',knee:true},
 splitSquat:{ar:'سبليت سكوات بدعم (مدى صغير)',en:'Supported Split Squat',unit:'reps',perSide:true,weighted:true,minPhase:3,cue:'امسك دعامة وانزل مدى صغيراً فقط. لا اندفاع عميق.',knee:true},
 farmer:{ar:'حمل الفلاحين (Farmer Carry)',en:'Farmer Carries',unit:'sec',weighted:true,minPhase:3,cue:'قامة معتدلة، خطوات ثابتة، وزن يسمح بتحكم كامل.',knee:true,fig:'farmer'},
 coreLimb:{ar:'ثبات الجذع مع حركة الأطراف',en:'Core Stability with Limb Movement',unit:'reps',perSide:true,minPhase:3,cue:'ابقَ على الوضعية المحايدة للجذع أثناء حركة الأطراف.',fig:'birdDog'}
};
const UNITLBL={reps:'تكرار',sec:'ثانية',breaths:'أنفاس',min:'دقائق'};
function exDef(id){return LIB[id]||(S&&S.customEx.find(c=>c.id===id))||{ar:id,en:id,unit:'reps'}}

/* =====================================================================
   3) رسوم توضيحية بسيطة (منظر جانبي، وضعية البداية ← النهاية)
   ===================================================================== */
const SUP=(hx,hy)=>({h:[hx,hy]});
const FIG={
 breathing:[{h:[20,74],l:[[[28,76],[62,76]],[[62,76],[78,52],[90,76]]]},{h:[20,74],l:[[[28,76],[45,70],[62,76]],[[62,76],[78,52],[90,76]]]}],
 pelvicTilt:[{h:[20,74],l:[[[28,76],[42,73],[62,71]],[[62,71],[78,50],[90,76]]]},{h:[20,74],l:[[[28,76],[62,76]],[[62,76],[78,52],[90,76]]]}],
 heelSlide:[{h:[20,74],l:[[[28,76],[62,76]],[[62,76],[78,52],[90,76]],[[62,77],[104,77]]]},{h:[20,74],l:[[[28,76],[62,76]],[[62,76],[104,76]],[[62,77],[104,77]]]}],
 bridge:[{h:[20,74],l:[[[28,76],[62,76]],[[62,76],[78,52],[90,76]]]},{h:[20,74],l:[[[28,76],[62,56]],[[62,56],[82,52],[90,76]]]}],
 sitStand:[{h:[47,20],p:'<path class="prop" d="M26 56H64M30 56V82M60 56V82M26 56V30"/>',l:[[[46,52],[46,28]],[[46,52],[68,52],[68,80]],[[46,32],[58,42],[68,44]]]},{h:[62,16],p:'<path class="prop" d="M26 56H64M30 56V82M60 56V82M26 56V30"/>',l:[[[62,48],[62,24]],[[62,48],[62,66],[62,82]],[[62,28],[74,36],[86,36]]]}],
 hinge:[{h:[60,15],l:[[[60,48],[60,24]],[[60,48],[60,66],[60,82]],[[60,26],[60,46]]]},{h:[86,34],l:[[[50,48],[78,36]],[[50,48],[52,66],[54,82]],[[78,36],[80,58]]]}],
 calfRaise:[{h:[70,15],p:'<path class="prop" d="M98 8V82"/>',l:[[[70,48],[70,24]],[[70,48],[70,66],[70,82]],[[70,82],[78,82]],[[70,28],[84,36],[96,34]]]},{h:[70,7],p:'<path class="prop" d="M98 8V82"/>',l:[[[70,40],[70,16]],[[70,40],[70,58],[70,74]],[[70,74],[78,82]],[[70,20],[84,28],[96,26]]]}],
 deadBug:[{h:[20,74],l:[[[28,76],[62,76]],[[34,76],[34,46]],[[62,76],[72,52],[92,52]]]},{h:[20,74],l:[[[28,76],[62,76]],[[34,76],[34,46]],[[32,72],[6,68]],[[62,76],[72,52],[92,52]],[[62,76],[104,70]]]}],
 slBalance:[{h:[60,15],p:'<path class="prop" d="M94 8V82"/>',l:[[[60,48],[60,24]],[[60,48],[60,66],[60,82]],[[60,28],[76,36],[94,36]]]},{h:[60,15],p:'<path class="prop" d="M94 8V82"/>',l:[[[60,48],[60,24]],[[60,48],[60,66],[60,82]],[[60,48],[74,56],[70,72]],[[60,28],[76,36],[94,36]]]}],

function nextSession(){
  const t=today();

  for(let i=doneToday?1:0;i<=8;i++){const d=addDays(t,i);const ty=SCHED[parseD(d).getDay()];if(['A','B','C'].includes(ty))return{date:d,type:ty,i}}

}
function readiness(){
  const ph=S.phase;
  if(ph===0)return{status:'phase0',crit:[],title:'ابدأ بالتقييم الأولي'};
  const inPh=strengthSessions().filter(s=>s.phase===ph);
  const done=inPh.filter(s=>!s.stopped);
  const last3=done.slice(-3),last4=inPh.slice(-4);
  const recent=S.sessions.slice(-3);
  const red=recent.some(s=>(s.symptoms||[]).some(k=>REDK.includes(k)));
  const crit=[];
  const need=MIN_SESS[ph];
  if(need)crit.push({ok:done.length>=need,label:'عدد الحصص المكتملة في المرحلة',detail:`${done.length} من ${need} كحد أدنى (وليس شرطاً كافياً وحده)`});
  crit.push({ok:last3.length>=3&&avg(last3.map(s=>s.pain||0))<=3&&Math.max(...last3.map(s=>s.pain||0))<=4,label:'الألم منخفض في آخر 3 حصص',detail:last3.length?`المتوسط ${r1(avg(last3.map(s=>s.pain||0)))}/10`:'لا توجد بيانات كافية'});
  const stops=last4.filter(s=>s.stopped||(s.symptoms||[]).some(k=>STOPK.includes(k)));
  crit.push({ok:last4.length>=3&&stops.length===0,label:'لا ألم واضح/تورم/قفل/عدم ثبات أو إيقاف للحصة (آخر 4 حصص)',detail:stops.length?`سُجّلت ${stops.length} حصة بأعراض أو إيقاف`:last4.length<3?'بيانات غير كافية':'لا أعراض مسجّلة'});
  crit.push({ok:last3.length>=3&&avg(last3.map(s=>s.rpe||0))<=6.5,label:'شدة الجهد مناسبة (RPE ≤ 6.5)',detail:last3.length?`المتوسط ${r1(avg(last3.map(s=>s.rpe||0)))}/10`:'لا توجد بيانات كافية'});
  crit.push({ok:last3.length>=3&&avg(last3.map(s=>s.control||0))>=4,label:'التحكم في الحركة جيد (تقييمك ≥ 4/5)',detail:last3.length?`المتوسط ${r1(avg(last3.map(s=>s.control||0)))}/5`:'لا توجد بيانات كافية'});
  const ass=S.assessments.length?S.assessments[S.assessments.length-1]:null;
  crit.push({ok:!!ass&&diffDays(ass.date,today())<=14,label:'سُجّل اختبار متابعة خلال آخر 14 يوماً',detail:ass?`آخر اختبار: ${fmtS(ass.date)}`:'لا يوجد اختبار'});
  if(ph>=1&&ph<4){const miss=MED_REQ.filter(k=>!S.medical[k]);crit.push({ok:miss.length===0,label:'التقييمات الطبية المطلوبة مكتملة',detail:miss.length?'ينقص: '+miss.map(k=>MED.find(m=>m[0]===k)[1].split(' ').slice(0,3).join(' ')+'…').join('، '):'مكتملة'})}
  if(red)return{status:'urgent',crit,title:'أعراض تستدعي تقييماً طبياً عاجلاً'};
  if(ph>=4)return{status:'final',crit,title:'أنت في مرحلة العودة للتدريب'};
  const allOk=crit.every(c=>c.ok);
  return{status:allOk?'ready':'hold',crit,title:allOk?'مؤشرات الجاهزية جيدة للتدرج':'ثبّت المرحلة الحالية'};

function assessSession(s){
  const msgs=[];let level='ok';const up=l=>{const o=['ok','caution','stop','urgent'];if(o.indexOf(l)>o.indexOf(level))level=l};
  const sy=s.symptoms||[];
  const reds=sy.filter(k=>REDK.includes(k));
  if(reds.length){up('urgent');msgs.push('ظهرت أعراض تستدعي تقييماً طبياً عاجلاً: '+reds.map(k=>SYMP_LBL[k]).join('، ')+'. لا تواصل التمرين، وتواصل مع الطبيب أو الطوارئ اليوم.')}
  const stops=sy.filter(k=>STOPK.includes(k));
  if(stops.length||s.stopped){up('stop');msgs.push('أُوقفت الحصة أو ظهر عرض في الركبة ('+(stops.map(k=>SYMP_LBL[k]).join('، ')||'إيقاف بسبب عرض')+'). تم تسجيل العرض. أوقف التمرين، ولا تتدرّج للمرحلة التالية، وراجع مختصاً إذا استمر.')}
  if((s.pain||0)>=5){up('caution');msgs.push('مستوى الألم مرتفع ('+s.pain+'/10): ثبّت المرحلة الحالية وخفّف الحمل في الحصة القادمة.')}
  if(sy.includes('urinary')){up('caution');msgs.push('سجّلت تغيراً في التحكم البولي أو القذف: لا تؤجّل مراجعة طبيب المسالك البولية.')}
  if(sy.some(k=>['back','pelvic','hyper'].includes(k))){up('caution');msgs.push('سُجّلت أعراض أخرى (ظهر/حوض/ركبة خلفية): راقبها في الحصة القادمة وخفّف المدى إذا لزم.')}
  return{level,msgs};
}
/* آخر أداء لتمرين + اقتراح تدرّج بمتغيّر واحد فقط (إما التكرارات أو الوزن، لا الاثنين معاً) */
function perfOf(sess,exId){
  const e=sess.exercises.find(x=>x.ex===exId);if(!e)return null;
  const rows=e.rows.filter(r=>r.done);if(!rows.length)return null;
  const w=rows.map(r=>num(r.weight)).filter(x=>x!=null),r=rows.map(r=>num(r.reps)||0);
  return{date:sess.date,avgW:w.length?avg(w):null,avgR:avg(r),maxW:w.length?Math.max(...w):null,rows,sess};
}
function lastPerfs(exId,n=2,beforeId){
  const out=[];for(let i=S.sessions.length-1;i>=0&&out.length<n;i--){const s=S.sessions[i];if(s.id===beforeId)continue;const p=perfOf(s,exId);if(p)out.push(p)}return out;
}
function suggestion(exDefn,item){
  const L=lastPerfs(item.ex,2);if(L.length<2)return null;
  const good=L.every(p=>p.sess.rpe<=6&&(p.sess.pain||0)<=3&&!p.sess.stopped&&!(p.sess.symptoms||[]).some(k=>STOPK.includes(k)));
  if(!good)return null;
  const top=item.repsMax||item.reps;
  const hitTop=L.every(p=>p.rows.length>=item.sets&&p.rows.every(r=>(num(r.reps)||0)>=top));
  if(!hitTop)return null;
  if(item.repsMax&&exDefn.weighted)return 'أنجزت أعلى نطاق للتكرارات مرتين بجهد مريح. جرّب رفع الوزن قليلاً مع العودة لأدنى التكرارات — غيّر متغيراً واحداً فقط.';
  if(!exDefn.weighted&&exDefn.unit==='reps')return 'أداء مستقر ومريح. إن رغبت، زِد تكراراً أو اثنين فقط (دون إضافة وزن) أو ثبّت كما هو.';
  return null;
}

function lineChart(series,labels,o={}){
  const W=320,H=o.h||160,L=30,R=8,T=8,B=22;
  const ys=series.flatMap(s=>s.data).filter(v=>v!=null);
  if(labels.length<2||ys.length<2)return '<p class="muted small">بيانات غير كافية للرسم بعد (تحتاج قياسين على الأقل).</p>';
  let lo=o.min!=null?o.min:Math.min(...ys),hi=o.max!=null?o.max:Math.max(...ys);if(lo===hi){lo-=1;hi+=1}
  const pd=(hi-lo)*.08;if(o.min==null)lo-=pd;if(o.max==null)hi+=pd;
  const X=i=>L+(W-L-R)*(i/(labels.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${y+3}" text-anchor="end">${r1(v)}</text>`}
  const step=Math.ceil(labels.length/6);labels.forEach((lb,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(lb)}</text>`});
  series.forEach((s,si)=>{
    const col=si===0?'var(--c1)':'var(--c2)';let d='',pen=false;
    s.data.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i)+' '+Y(v)+' ';pen=true});
    g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" ${si?'stroke-dasharray="6 4"':''} stroke-linejoin="round"/>`;
    s.data.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="${col}"><title>${esc(s.name)}: ${r1(v)} (${esc(labels[i])})</title></circle>`});
  });
  const lg=series.map((s,si)=>`<span><i style="background:${si?'var(--c2)':'var(--c1)'}"></i>${esc(s.name)}</span>`).join('');
  return `<div class="legend">${lg}</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function barChart(vals,labels,target){
  const W=320,H=130,L=26,R=6,T=8,B=22,mx=Math.max(target||0,...vals,1);
  const bw=(W-L-R)/vals.length;let g='';
  for(let k=0;k<=mx;k++){const y=T+(H-T-B)*(1-k/mx);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-4}" y="${y+3}" text-anchor="end">${k}</text>`}
  vals.forEach((v,i)=>{const h=(H-T-B)*(v/mx),x=L+bw*i+bw*.18;g+=`<rect x="${x}" y="${H-B-h}" width="${bw*.64}" height="${h}" rx="3" fill="var(--c1)"><title>${esc(labels[i])}: ${v}</title></rect><text x="${x+bw*.32}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`});
  if(target){const y=T+(H-T-B)*(1-target/mx);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--c2)" stroke-dasharray="5 4" stroke-width="1.6"/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ---------- الحصة ---------- */
function buildActive(type){
  const items=(S.plan[S.phase]||{})[type]||[];
  const exs=items.map(item=>{
    const L=exDef(item.ex);const sides=item.perSide||L.perSide?['L','R']:[null];const perSide=!!sides[0]||false;
    const rows=[];for(let s=1;s<=item.sets;s++)for(const sd of sides)rows.push({set:s,side:sd,reps:'',weight:'',done:false,dur:0});
    return{ex:item.ex,ar:L.ar,en:L.en,unit:L.unit,sets:item.sets,reps:item.reps,repsMax:item.repsMax||null,perSide:sides[0]!==null,weighted:item.weighted??!!L.weighted,optional:!!item.optional,note:item.note||'',gate:L.gate||null,noRest:!!L.noRest,rows,status:'pending'};
  });
  return{id:uid(),date:today(),type,phase:S.phase,week:weekNo(),startedAt:Date.now(),exercises:exs,cur:0,rest:null,work:null};
}
function targetTxt(e){
  const r=e.reps+(e.repsMax?'–'+e.repsMax:'');
  if(e.unit==='min')return `${r} دقائق`;
  if(e.unit==='breaths')return `${r} أنفاس`;
  return `<bdi dir="ltr">${e.sets} × ${r}</bdi>${e.unit==='sec'?' ثانية':''}${e.perSide?' لكل جهة':''}`;
}

  }
  const done=a.exercises.filter(e=>e.status==='done').length,tot=a.exercises.length;
  let h=`<div class="card"><div class="row between"><div><b>${SNAME[a.type]}</b> <span class="tag">المرحلة ${a.phase}</span><div class="small muted">الزمن المنقضي <span id="elapsed">0:00</span> · ${done}/${tot} تمارين</div></div></div>
  <div class="bar" style="margin-top:8px"><i style="width:${tot?done/tot*100:0}%"></i></div></div>
  <div class="alert a-info small"><b>تذكير للركبة اليسرى</b>تجنّب قفل الركبة للخلف (Hyperextension) أثناء الوقوف والتمارين، وحافظ على انثناء طفيف. الشدة المستهدفة ${a.phase===1?'حوالي 5/10':'مريحة بلا ألم'}. عند ألم واضح أو تورم أو قفل أو عدم ثبات: أوقف وسجّل العرض.</div>`;

  <button class="btn-block btn-s" style="margin-top:8px" data-act="discard">إلغاء الحصة دون حفظ</button>`;

function exCard(e,i,a){
  const open=a.cur===i,L=exDef(e.ex);
  const locked=e.gate&&!S.medical[e.gate];
  const nm=`${esc(e.ar)}${S.settings.showEn?`<div class="tiny muted" dir="ltr" style="text-align:start">${esc(e.en)}</div>`:''}`;
  const status=e.status==='done'?'<span class="tag ok">تم</span>':e.status==='skipped'?'<span class="tag warn">تم التخطي</span>':e.optional?'<span class="tag">اختياري</span>':'';
  let h=`<div class="ex ${open?'cur':''} ${e.status==='done'?'done':''}"><div class="ex-h" data-act="exOpen" data-i="${i}"><div class="ex-n">${e.status==='done'?'✓':i+1}</div><div class="grow"><b>${nm}</b><div class="small muted">${targetTxt(e)}</div></div>${status}</div>`;
  if(open){
    h+=`<div class="ex-b">${figs(e.ex)}<p class="small" style="margin:0 0 6px">${esc(L.cue||'')}${e.note?` <b>${esc(e.note)}</b>`:''}</p>`;
    if(L.knee)h+=`<p class="tiny" style="margin:0 0 6px;color:var(--warn)">لا تقفل الركبة اليسرى للخلف.</p>`;
    if(locked){h+=`<div class="alert a-warn small"><b>مقفل</b>يُنفَّذ فقط إذا سمح تقييم الركبة. فعّل الخيار من «التقييم ← التقييم الأولي» بعد موافقة المختص، أو تخطَّ التمرين.</div><button class="btn-block" data-act="exSkip" data-i="${i}">تخطي التمرين</button></div></div>`;return h}
    const item={ex:e.ex,sets:e.sets,reps:e.reps,repsMax:e.repsMax};
    const sg=suggestion(L,item);const lp=lastPerfs(e.ex,1,a.id)[0];
    if(lp)h+=`<div class="small muted" style="margin-bottom:4px">آخر مرة (${fmtS(lp.date)}): ${lp.rows.map(r=>`${esc(r.reps||'-')}${r.weight?'×'+esc(r.weight)+'كجم':''}`).join('، ')}</div>`;
    if(sg)h+=`<div class="alert a-info small"><b>اقتراح تدرّج</b>${esc(sg)}</div>`;
    e.rows.forEach((r,ri)=>{
      const running=a.work&&a.work.ei===i&&a.work.ri===ri;
      const side=r.side?(r.side==='L'?'اليسار':'اليمين'):'';
      const busy=a.work&&!running;
      const tgt=e.repsMax||e.reps;
      h+=`<div class="setrow ${r.done?'done':''}"><div class="lbl"><b>مجموعة ${r.set}</b>${side?`<div class="tiny muted">${side}</div>`:''}</div>
      ${e.weighted?`<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="الوزن كجم" value="${esc(r.weight)}" data-bind="row" data-i="${i}" data-r="${ri}" data-f="weight" aria-label="الوزن">`:'<span></span>'}
      ${e.unit==='min'?'<span></span>':`<input type="number" inputmode="numeric" min="0" placeholder="${e.unit==='sec'?'ثوانٍ':'تكرار'} (${tgt})" value="${esc(r.reps)}" data-bind="row" data-i="${i}" data-r="${ri}" data-f="reps" aria-label="التكرارات">`}
      <div class="act">${r.done?`<span class="grow">✅ تم${r.dur?` · ${mmss(r.dur)}`:''}</span><button class="btn-s" data-act="rowUndo" data-i="${i}" data-r="${ri}">تعديل</button>`
      :running?`<span class="timer-big" id="workT">0:00</span><button class="btn-p grow" data-act="rowFinish" data-i="${i}" data-r="${ri}">إنهاء المجموعة</button>`
      :`<button class="btn-p grow" ${busy?'disabled':''} data-act="rowStart" data-i="${i}" data-r="${ri}">بدء المجموعة</button><button class="btn-s" ${busy?'disabled':''} data-act="rowQuick" data-i="${i}" data-r="${ri}" title="تسجيل سريع دون مؤقت">تسجيل سريع ✓</button>`}</div></div>`;
    });
    h+=`<div class="row" style="margin-top:8px"><label class="check grow" style="border:0;padding:0"><input type="checkbox" data-act="exToggle" data-i="${i}" ${e.status==='done'?'checked':''}><span>تم إكمال التمرين</span></label><button class="btn-s" data-act="exSkip" data-i="${i}">تخطي</button></div></div>`;
  }
  return h+'</div>';
}
/* منطق المجموعات */
function curRow(ei,ri){const e=S.active.exercises[ei];return[e,e.rows[ri]]}
function targetSecs(e){return e.unit==='min'?e.reps*60:e.unit==='sec'?e.reps:0}
function rowStart(ei,ri){audio();const a=S.active,e=a.exercises[ei];a.work={ei,ri,startAt:Date.now(),target:targetSecs(e)};a.cur=ei;save();render()}
function rowFinish(ei,ri,auto){
  const a=S.active;if(!a)return;const[e,r]=curRow(ei,ri);
  const el=a.work&&a.work.ei===ei&&a.work.ri===ri?Math.round((Date.now()-a.work.startAt)/1000):0;
  r.dur=el;r.done=true;a.work=null;
  if(e.unit==='min')r.reps=Math.max(1,Math.round(el/60))||e.reps;
  else if(e.unit==='sec'){if(r.reps==='')r.reps=auto?e.reps:el}
  else if(r.reps==='')r.reps=e.repsMax||e.reps;
  afterRow(ei,ri,auto);
}
function rowQuick(ei,ri){const a=S.active,[e,r]=curRow(ei,ri);a.work=null;r.done=true;if(r.reps==='')r.reps=e.unit==='min'?e.reps:(e.repsMax||e.reps);afterRow(ei,ri,false,true)}
function afterRow(ei,ri,auto,quick){
  const a=S.active,e=a.exercises[ei],r=e.rows[ri];
  if(e.rows.every(x=>x.done)){e.status='done';warnBoth(e);const n=a.exercises.findIndex(x=>x.status==='pending');a.cur=n>=0?n:ei}
  const hasMore=a.exercises.some(x=>x.status==='pending'&&x.rows.some(y=>!y.done))||e.rows.some(x=>!x.done);
  const switching=e.perSide&&r.side==='L';
  if(!quick&&hasMore&&!switching&&!e.noRest)startRest();
  if(auto)beep();
  save();render();
}
function warnBoth(e){
  const a=S.active;const p=lastPerfs(e.ex,1,a.id)[0];if(!p||!e.weighted)return;
  const w=avg(e.rows.map(r=>num(r.weight)).filter(x=>x!=null)),rp=avg(e.rows.map(r=>num(r.reps)||0));
  if(w!=null&&p.avgW!=null&&w>p.avgW+1e-9&&rp>p.avgR+1e-9)toast('زدت الوزن والتكرارات معاً مقارنة بآخر مرة. الأفضل زيادة متغيّر واحد فقط في كل مرة.');
}
function startRest(){const a=S.active;const s=S.settings.rest;a.rest={endAt:Date.now()+s*1000,total:s};renderRest()}
function renderRest(){
  const a=S.active,b=$('#restbar');
  if(!a||!a.rest||!S.onboarded){b.style.display='none';return}
  b.style.display='block';updateRest();
}
function updateRest(){
  const a=S.active,b=$('#restbar');if(!a||!a.rest)return;
  const left=Math.ceil((a.rest.endAt-Date.now())/1000);
  if(left<=0){if(!a.rest.ended){a.rest.ended=true;a.rest.endedAt=Date.now();beep();b.classList.add('end');$('#restTime').textContent='انتهت الراحة';save()}
    if(Date.now()-a.rest.endedAt>8000){a.rest=null;b.classList.remove('end');b.style.display='none';save()}return}
  b.classList.remove('end');$('#restTime').textContent=mmss(left);
}
setInterval(()=>{
  const a=S.active;if(!a||!S.onboarded)return;
  const el=$('#elapsed');if(el)el.textContent=mmss((Date.now()-a.startedAt)/1000);
  updateRest();
  if(a.work){
    const w=a.work,sec=Math.floor((Date.now()-w.startAt)/1000),t=$('#workT');
    if(w.target){const left=w.target-sec;if(t)t.textContent=mmss(left);if(left<=0){rowFinish(w.ei,w.ri,true);return}}
    else if(t)t.textContent=mmss(sec);
  }
},250);

/* ---------- التقدم ---------- */
function sessionsInWeek(ws){return S.sessions.filter(s=>weekStart(s.date)===ws)}
function weekStats(ws){
  const ss=sessionsInWeek(ws),st=ss.filter(s=>s.type!=='R'&&!s.stopped);
  let vol=0,sets=0;st.forEach(s=>s.exercises.forEach(e=>e.rows.forEach(r=>{if(r.done){sets++;const w=num(r.weight),rp=num(r.reps);if(w&&rp)vol+=w*rp}})));
  const pains=ss.map(s=>s.pain||0),rpes=ss.filter(s=>s.rpe).map(s=>s.rpe);
  return{ss,strength:st.length,recovery:ss.filter(s=>s.type==='R').length,sets,vol,pain:ss.length?avg(pains):null,painMax:ss.length?Math.max(...pains):null,rpe:avg(rpes),stopped:ss.filter(s=>s.stopped).length};
}
function cmp(cur,prev,lowerBetter,unit=''){
  if(cur==null||prev==null)return '<span class="muted">—</span>';const d=cur-prev;if(Math.abs(d)<.05)return '<span class="muted">=</span>';
  const good=lowerBetter?d<0:d>0;return `<span class="${good?'up':'down'}">${d>0?'▲':'▼'} ${r1(Math.abs(d))}${unit}</span>`;
}
function vProgress(){
  const off=S.ui.weekOffset||0,ws=addDays(weekStart(today()),off*7),pw=addDays(ws,-7);
  const cur=weekStats(ws),prev=weekStats(pw),rd=readiness();
  let h=`<div class="card"><h2>الجاهزية للتدرج</h2>${readinessBody(rd)}</div>`;
  h+=`<div class="card"><div class="row between"><button class="btn-s" data-act="weekNav" data-d="-1">‹ السابق</button><b>أسبوع ${fmtS(ws)} – ${fmtS(addDays(ws,6))}</b><button class="btn-s" data-act="weekNav" data-d="1" ${off>=0?'disabled':''}>التالي ›</button></div>
  <div class="grid3" style="margin-top:10px"><div class="kpi"><b>${cur.strength}/3</b><span class="small muted">حصص القوة</span></div><div class="kpi"><b>${cur.sets}</b><span class="small muted">مجموعات</span></div><div class="kpi"><b>${r1(cur.pain)}</b><span class="small muted">متوسط الألم</span></div></div>
  <h3>مقارنة بالأسبوع السابق</h3><table class="t"><tr><th></th><th>هذا الأسبوع</th><th>السابق</th><th>التغيّر</th></tr>
  <tr><td>حصص القوة</td><td>${cur.strength}</td><td>${prev.strength}</td><td>${cmp(cur.strength,prev.strength,false)}</td></tr>
  <tr><td>المجموعات المنفذة</td><td>${cur.sets}</td><td>${prev.sets}</td><td>${cmp(cur.sets,prev.sets,false)}</td></tr>
  <tr><td>حجم الأوزان (كجم)</td><td>${Math.round(cur.vol)}</td><td>${Math.round(prev.vol)}</td><td>${cmp(cur.vol,prev.vol,false)}</td></tr>
  <tr><td>متوسط الألم</td><td>${r1(cur.pain)}</td><td>${r1(prev.pain)}</td><td>${cmp(cur.pain,prev.pain,true)}</td></tr>
  <tr><td>متوسط RPE</td><td>${r1(cur.rpe)}</td><td>${r1(prev.rpe)}</td><td>${cmp(cur.rpe,prev.rpe,true)}</td></tr></table>
  ${cur.ss.length?'<h3>التمارين والأعراض والملاحظات</h3>'+cur.ss.map(sessDetail).join(''):'<p class="muted small">لا حصص مسجّلة في هذا الأسبوع.</p>'}</div>`;
  h+=chartsCard();
  return h;
}
function sessDetail(s){
  const sy=(s.symptoms||[]).map(k=>`<span class="tag ${REDK.includes(k)||STOPK.includes(k)?'bad':'warn'}">${esc(SYMP_LBL[k])}</span>`).join('');
  return `<details><summary>${fmtD(s.date)} · ${SNAME[s.type]}${s.stopped?' <span class="tag bad">أُوقفت</span>':''} · ألم ${s.pain}/10</summary>
  ${s.exercises.filter(e=>e.status!=='skipped').map(e=>`<div class="stat"><span>${esc(e.ar)}</span><span dir="ltr">${e.rows.filter(r=>r.done).map(r=>`${r.reps||'-'}${r.weight?'@'+r.weight:''}`).join(' · ')||'—'}</span></div>`).join('')}
  <div style="margin-top:6px">${sy}</div>${s.notes?`<p class="small muted">📝 ${esc(s.notes)}</p>`:''}</details>`;

function readinessBody(rd){
  let h=readyBadge(rd);

  h+=rd.crit.map(c=>`<div class="check"><span>${c.ok?'✅':'⬜'}</span><span><b class="small">${esc(c.label)}</b><div class="tiny muted">${esc(c.detail)}</div></span></div>`).join('');
  h+=`<label class="f">ملاحظات المراجعة الأسبوعية (اختياري)</label><textarea id="revNotes" placeholder="كيف شعرت هذا الأسبوع؟"></textarea>`;
  if(S.phase<4)h+=`<div class="grid2" style="margin-top:10px"><button class="btn-p" data-act="reviewHold">تثبيت المرحلة وحفظ المراجعة</button><button data-act="reviewAdvance" ${rd.status==='ready'?'':'disabled'}>تأكيد الانتقال للمرحلة ${S.phase+1}</button></div><p class="tiny muted">لا يتم الانتقال تلقائياً أبداً: يلزم تحقق كل المعايير وتأكيدك بنفسك.</p>`;
  else h+=`<button class="btn-p btn-block" style="margin-top:10px" data-act="reviewHold">حفظ المراجعة الأسبوعية</button><div class="alert a-warn small" style="margin-top:10px"><b>الجري والقفز وتغيير الاتجاه</b>لا تُدخلها قبل تقييم الاستعداد لها مع مختص. هذا التطبيق لا يتضمنها.</div>`;
  if(S.phase>=2)h+=`<button class="btn-block btn-s" style="margin-top:8px" data-act="stepBack">العودة للمرحلة ${S.phase-1} (عند عودة الأعراض أو الحاجة للتثبيت)</button>`;
  return h;
}
function chartsCard(){
  const strength=strengthSessions().slice(-12);
  const lab=strength.map(s=>fmtS(s.date));
  let h=`<div class="card"><h2>الألم والجهد عبر الحصص</h2>${lineChart([{name:'الألم',data:strength.map(s=>s.pain??null)},{name:'RPE',data:strength.map(s=>s.rpe??null)}],lab,{min:0,max:10})}</div>`;
  const wk=[];const base=weekStart(today());for(let i=7;i>=0;i--)wk.push(addDays(base,-7*i));
  h+=`<div class="card"><h2>الحصص المكتملة أسبوعياً</h2>${barChart(wk.map(w=>weekStats(w).strength),wk.map(fmtS),3)}<div class="tiny muted">الخط المتقطع = الهدف (3 حصص)</div></div>`;
  const exs=new Map();S.sessions.forEach(s=>s.exercises.forEach(e=>{if(e.rows.some(r=>r.done))exs.set(e.ex,e.ar)}));
  const sel=S.ui.chartEx&&exs.has(S.ui.chartEx)?S.ui.chartEx:[...exs.keys()][0]||'';
  const met=S.ui.chartMetric;
  let ch='<p class="muted small">سجّل حصصاً لعرض تطور التمارين.</p>';
  if(sel){
    const pts=[];S.sessions.forEach(s=>{const p=perfOf(s,sel);if(p)pts.push({d:fmtS(s.date),w:p.avgW,r:p.avgR,v:p.rows.reduce((t,r)=>t+(num(r.weight)||0)*(num(r.reps)||0),0)})});
    const key={weight:['الوزن (كجم)','w'],reps:['التكرارات','r'],vol:['الحجم (كجم×تكرار)','v']}[met];
    ch=lineChart([{name:key[0],data:pts.map(p=>p[key[1]])}],pts.map(p=>p.d));
  }
  h+=`<div class="card"><h2>تطور تمرين</h2><select data-bind="chartEx">${[...exs].map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(v)}</option>`).join('')}</select>
  <div class="seg" style="margin-top:8px">${[['weight','الوزن'],['reps','التكرارات'],['vol','الحجم']].map(([k,l])=>`<button class="${met===k?'on':''}" data-act="metric" data-m="${k}">${l}</button>`).join('')}</div>${ch}</div>`;
  return h;
}

}

}
function vPlan(){
  const ph=S.ui.planPhase,se=S.ui.planSess;const list=S.plan[ph][se];
  let h=`<div class="seg">${[1,2,3,4].map(p=>`<button class="${ph===p?'on':''}" data-act="planPh" data-p="${p}">م${p}</button>`).join('')}</div>
  <div class="seg">${['A','B','C'].map(x=>`<button class="${se===x?'on':''}" data-act="planSe" data-s="${x}">${SNAME[x]}</button>`).join('')}</div>
  <p class="small muted">التعديلات تُطبَّق على الحصص الجديدة. ${ph>S.phase?'هذه مرحلة لم تصلها بعد.':''}</p>`;
  h+=list.map((p,i)=>{const L=exDef(p.ex);
    return `<div class="card"><div class="row between"><b>${esc(L.ar)}</b><span class="tiny muted" dir="ltr">${esc(L.en)}</span></div>
    <div class="grid3"><div><label class="f">المجموعات</label><input type="number" min="1" max="10" value="${p.sets}" data-bind="plan" data-i="${i}" data-f="sets"></div>
    <div><label class="f">${L.unit==='sec'?'ثوانٍ':L.unit==='min'?'دقائق':'تكرارات'}</label><input type="number" min="1" value="${p.reps}" data-bind="plan" data-i="${i}" data-f="reps"></div>
    <div><label class="f">حتى (اختياري)</label><input type="number" min="1" value="${p.repsMax||''}" data-bind="plan" data-i="${i}" data-f="repsMax"></div></div>
    <div class="row wrapf" style="margin-top:6px"><label class="check" style="border:0;padding:4px 0"><input type="checkbox" data-bind="plan" data-i="${i}" data-f="optional" ${p.optional?'checked':''}><span>اختياري</span></label>
    <label class="check" style="border:0;padding:4px 0"><input type="checkbox" data-bind="plan" data-i="${i}" data-f="perSide" ${p.perSide??L.perSide?'checked':''}><span>لكل جهة</span></label>
    ${L.unit==='reps'||L.unit==='sec'?`<label class="check" style="border:0;padding:4px 0"><input type="checkbox" data-bind="plan" data-i="${i}" data-f="weighted" ${p.weighted??L.weighted?'checked':''}><span>تسجيل وزن</span></label>`:''}</div>
    <div class="row"><button class="btn-s" data-act="planMove" data-i="${i}" data-d="-1" ${i===0?'disabled':''}>▲</button><button class="btn-s" data-act="planMove" data-i="${i}" data-d="1" ${i===list.length-1?'disabled':''}>▼</button><button class="btn-s" data-act="planDel" data-i="${i}">حذف</button></div></div>`}).join('');
  const all={...LIB};S.customEx.forEach(c=>all[c.id]=c);
  h+=`<div class="card"><h2>إضافة تمرين</h2><select id="addEx">${Object.entries(all).map(([k,v])=>`<option value="${k}">${esc(v.ar)} – ${esc(v.en)}</option>`).join('')}</select>
  <button class="btn-p btn-block" style="margin-top:8px" data-act="planAdd">إضافة من المكتبة</button>
  <h3>تمرين مخصص</h3><div class="grid2"><input type="text" id="cuAr" placeholder="الاسم بالعربية"><input type="text" id="cuEn" placeholder="English name" dir="ltr"></div>
  <select id="cuUn" style="margin-top:8px"><option value="reps">تكرارات</option><option value="sec">ثوانٍ</option></select>
  <button class="btn-block" style="margin-top:8px" data-act="planCustom">إضافة تمرين مخصص</button></div>
  <button class="btn-block" data-act="planReset">استعادة الافتراضي لهذه المرحلة</button>`;
  return h;
}

/* ---------- التصدير ---------- */
function vExport(){
  return `<div class="card"><h2>تصدير السجل</h2>
  <button class="btn-p btn-block" data-act="csvSessions">تصدير سجل الحصص CSV</button>
  <button class="btn-block" style="margin-top:8px" data-act="csvAssess">تصدير الاختبارات CSV</button>

  <div class="card"><h2>نسخة احتياطية كاملة</h2><p class="small muted">بياناتك محفوظة في هذا المتصفح فقط. احتفظ بنسخة احتياطية قبل تغيير الجهاز أو مسح بيانات المتصفح.</p>

  <label class="f">استعادة من ملف</label><input type="file" accept="application/json" id="restoreF"></div>`;
}
function dl(name,mime,text){
  const b=new Blob([text],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const csvCell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function csvSessions(){
  const H=['التاريخ','المرحلة','الأسبوع','الحصة','التمرين','Exercise','المجموعة','الجانب','التكرارات/الثواني','الوزن كجم','حالة التمرين','RPE','الألم','التحكم','الأعراض','ملاحظات'];
  const rows=[H];
  S.sessions.forEach(s=>{
    const common=[s.rpe??'',s.pain??'',s.control??'',(s.symptoms||[]).map(k=>SYMP_LBL[k]).join(' | '),s.notes||''];
    if(!s.exercises.length||s.type==='R'){rows.push([s.date,s.phase,s.week,SNAME[s.type],'','','','','','','',...common]);return}
    s.exercises.forEach(e=>{
      if(!e.rows.length)return;
      e.rows.forEach(r=>rows.push([s.date,s.phase,s.week,SNAME[s.type]+(s.stopped?' (أُوقفت)':''),e.ar,e.en,r.set,r.side==='L'?'يسار':r.side==='R'?'يمين':'',r.reps,r.weight,r.done?'منجز':e.status==='skipped'?'متخطى':'غير منجز',...common]));
    });
  });
  dl(`training-log-${today()}.csv`,'text/csv;charset=utf-8','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));
}
function csvAssess(){
  const H=['التاريخ','KneeToWall يسار','KneeToWall يمين','Balance يسار (ث)','Balance يمين (ث)','ASLR يسار','ASLR يمين','Hamstring يسار','Hamstring يمين','Hamstring ملاحظات','توزيع الوزن','Mini Squat'];
  const rows=[H,...S.assessments.map(a=>[a.date,a.ktwL,a.ktwR,a.slbL,a.slbR,a.aslrL,a.aslrR,a.hamL,a.hamR,a.hamN,a.wd,a.mini])];
  dl(`assessments-${today()}.csv`,'text/csv;charset=utf-8','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));
}
function pdfReport(){
  const p=$('#print');
  const rows=S.sessions.map(s=>`<tr><td>${s.date}</td><td>${SNAME[s.type]}${s.stopped?' (أُوقفت)':''}</td><td>م${s.phase}/أ${s.week}</td><td>${s.durationMin}</td><td>${s.rpe??'-'}</td><td>${s.pain}</td><td>${esc((s.symptoms||[]).map(k=>SYMP_LBL[k]).join('، '))}</td><td>${s.exercises.filter(e=>e.status==='done').map(e=>esc(e.ar)+': '+e.rows.filter(r=>r.done).map(r=>(r.reps||'-')+(r.weight?'@'+r.weight:'')).join('/')).join(' ؛ ')}</td><td>${esc(s.notes||'')}</td></tr>`).join('');
  const ar=S.assessments.map(a=>`<tr><td>${a.date}</td><td>${esc(a.ktwL||'-')} / ${esc(a.ktwR||'-')}</td><td>${esc(a.slbL||'-')} / ${esc(a.slbR||'-')}</td><td>${esc(a.hamL||'-')} / ${esc(a.hamR||'-')}</td><td>${esc([a.aslrL,a.aslrR,a.wd,a.mini].filter(Boolean).join(' | '))}</td></tr>`).join('');
  p.innerHTML=`<h1>تقرير التدريب والتأهيل</h1><p>تاريخ التقرير: ${today()} · المرحلة الحالية: ${S.phase} · حصص القوة المكتملة: ${completedStrength().length}/36</p>
  <p>هذا التقرير سجل شخصي للمتابعة وليس تشخيصاً طبياً.</p>
  <h2>الحصص</h2><table><tr><th>التاريخ</th><th>الحصة</th><th>المرحلة/الأسبوع</th><th>دقائق</th><th>RPE</th><th>ألم</th><th>أعراض</th><th>التمارين (تكرارات@وزن)</th><th>ملاحظات</th></tr>${rows}</table>
  <h2>اختبارات المتابعة (يسار / يمين)</h2><table><tr><th>التاريخ</th><th>Knee-to-Wall</th><th>Balance (ث)</th><th>Hamstring</th><th>ملاحظات</th></tr>${ar}</table>`;
  setTimeout(()=>window.print(),100);
}

/* =====================================================================
   11) الأحداث
   ===================================================================== */
const A={
 nav:el=>{S.ui.tab=el.dataset.t;S.ui.more=null;render();window.scrollTo(0,0)},
 onboard:()=>{if(!$('#agree').checked){toast('يلزم تأكيد قراءة التنبيهات أولاً.');return}S.onboarded=true;save();render()},
 toggleMed:el=>{const k=el.dataset.k;S.medical[k]=el.checked?today():null;save();render()},
 startPhase1:()=>{
  const miss=MED.slice(0,5).filter(m=>!S.medical[m[0]]);
  if(miss.length&&!confirm('لم تكتمل بعض تقييمات المرحلة 0 بعد. يُنصح بإكمالها (خاصة مراجعة طبيب المسالك). هل تريد بدء المرحلة 1 الآن على أي حال؟'))return;
  S.phase=1;S.phaseStart=today();S.programStart=today();save();render();
 },
 startSession:el=>{
  if(S.phase===0){toast('ابدأ المرحلة 1 أولاً.');return}
  if(S.active){go('workout');return}
  S.active=buildActive(el.dataset.t);S.ui.fin=null;S.ui.result=null;wakeLock();audio();save();
  if(el.dataset.t==='R'){openFin(false);S.ui.tab='workout';render();return}
  go('workout');
 },
 exOpen:el=>{S.active.cur=+el.dataset.i;save();render()},
 exToggle:el=>{const e=S.active.exercises[+el.dataset.i];e.status=el.checked?'done':'pending';if(el.checked)warnBoth(e);save();render()},
 exSkip:el=>{const a=S.active,i=+el.dataset.i;a.exercises[i].status='skipped';if(a.work&&a.work.ei===i)a.work=null;const n=a.exercises.findIndex(x=>x.status==='pending');a.cur=n>=0?n:i;save();render()},
 rowStart:el=>rowStart(+el.dataset.i,+el.dataset.r),
 rowFinish:el=>rowFinish(+el.dataset.i,+el.dataset.r,false),
 rowQuick:el=>rowQuick(+el.dataset.i,+el.dataset.r),
 rowUndo:el=>{const e=S.active.exercises[+el.dataset.i];e.rows[+el.dataset.r].done=false;if(e.status==='done')e.status='pending';save();render()},
 restAdj:el=>{const a=S.active;if(!a||!a.rest)return;a.rest.endAt+= +el.dataset.d*1000;a.rest.ended=false;save();updateRest()},
 restSkip:()=>{const a=S.active;if(a){a.rest=null;save()}renderRest();$('#restbar').classList.remove('end')},
 finishOpen:()=>{const a=S.active;if(a.work){toast('أنهِ المجموعة الجارية أولاً.');return}openFin(false)},
 stopOpen:()=>{const a=S.active;a.work=null;a.rest=null;openFin(true)},
 finCancel:()=>{S.ui.fin=null;save();render()},
 finishSave:finishSave,
 discard:()=>{if(confirm('إلغاء الحصة دون حفظ؟')){S.active=null;S.ui.fin=null;save();render()}},
 resultOk:()=>{S.ui.result=null;go('home')},
 weekNav:el=>{S.ui.weekOffset=Math.min(0,(S.ui.weekOffset||0)+ +el.dataset.d);render()},
 metric:el=>{S.ui.chartMetric=el.dataset.m;render()},
 reviewHold:()=>{saveReview('hold','تثبيت المرحلة الحالية');save();toast('تم حفظ المراجعة الأسبوعية.');render()},
 reviewAdvance:()=>{
  const rd=readiness();if(rd.status!=='ready'){toast('معايير الجاهزية غير مكتملة.');return}
  if(!confirm(`تأكيد الانتقال إلى المرحلة ${S.phase+1}: ${PHASES[S.phase+1].n}؟\nتأكد أنك تشعر بجاهزية فعلية وبلا أعراض مقلقة.`))return;
  saveReview('advance',`انتقال إلى المرحلة ${S.phase+1}`);S.phase++;S.phaseStart=today();save();toast('تم الانتقال. ابدأ المرحلة الجديدة بحذر.');render();
 },
 stepBack:()=>{if(S.phase<2)return;if(!confirm('العودة إلى المرحلة السابقة؟'))return;saveReview('back',`عودة إلى المرحلة ${S.phase-1}`);S.phase--;S.phaseStart=today();save();render()},
 saveAssess:()=>{
  const f=Object.assign({},S.ui.af||{});const has=['ktwL','ktwR','slbL','slbR','aslrL','aslrR','hamL','hamR','hamN','wd','mini'].some(k=>f[k]);
  if(!has){toast('أدخل قياساً أو ملاحظة واحدة على الأقل.');return}
  f.id=uid();f.date=f.date||today();S.assessments.push(f);S.assessments.sort((a,b)=>a.date<b.date?-1:1);S.ui.af={};save();toast('تم حفظ الاختبار.');render();
 },
 delAssess:el=>{if(confirm('حذف هذا الاختبار؟')){S.assessments=S.assessments.filter(a=>a.id!==el.dataset.id);save();render()}},
 more:el=>{S.ui.more=el.dataset.m||null;render();window.scrollTo(0,0)},
 delSession:el=>{if(confirm('حذف هذه الحصة من السجل؟')){S.sessions=S.sessions.filter(s=>s.id!==el.dataset.id);save();render()}},
 planPh:el=>{S.ui.planPhase=+el.dataset.p;render()},planSe:el=>{S.ui.planSess=el.dataset.s;render()},
 planMove:el=>{const l=S.plan[S.ui.planPhase][S.ui.planSess],i=+el.dataset.i,j=i+ +el.dataset.d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];save();render()},
 planDel:el=>{if(confirm('حذف هذا التمرين من الحصة؟')){S.plan[S.ui.planPhase][S.ui.planSess].splice(+el.dataset.i,1);save();render()}},
 planAdd:()=>addToPlan($('#addEx').value),
 planCustom:()=>{
  const ar=$('#cuAr').value.trim(),en=$('#cuEn').value.trim()||ar;if(!ar){toast('أدخل اسم التمرين.');return}
  if(KEGEL.test(ar+' '+en)){alert('لا يمكن إضافة تمارين كيجل أو مقاطعة تدفق البول دون تقييم مختص قاع الحوض.');return}
  const id='c_'+uid();S.customEx.push({id,ar,en,unit:$('#cuUn').value,custom:true,fig:'squat'});addToPlan(id,ar+' '+en);
 },
 planReset:()=>{if(confirm('استعادة التمارين الافتراضية لهذه المرحلة؟ ستُفقد تعديلاتك عليها.')){S.plan[S.ui.planPhase]=defaultPlan()[S.ui.planPhase];save();render()}},
 csvSessions,csvAssess,pdf:pdfReport,
 backup:()=>dl(`rehab-backup-${today()}.json`,'application/json',JSON.stringify(S)),
 wipe:()=>{if(confirm('سيتم حذف كل البيانات نهائياً. متابعة؟')&&confirm('تأكيد أخير: لا يمكن التراجع.')){localStorage.removeItem(KEY);load();render()}}
};
function addToPlan(id,nameForCheck){
  const ph=S.ui.planPhase,d=exDef(id);
  if(KEGEL.test((nameForCheck||'')+d.en+d.ar)){alert('غير مسموح: تمارين كيجل المكثفة أو مقاطعة البول تحتاج تقييم مختص.');return}
  if(RISKY.test((nameForCheck||'')+d.en+d.ar)&&ph<=2&&!confirm('هذا النوع من التمارين (قفز/جري/اندفاعات/سكوات عميق) يخالف قواعد الأمان في بداية البرنامج. إضافته ليست مناسبة قبل تقييم مختص. متابعة رغم ذلك؟'))return;
  if(d.minPhase&&ph<d.minPhase&&!confirm(`هذا التمرين مخصص عادة للمرحلة ${d.minPhase} فما بعد. إضافته للمرحلة ${ph} قد لا يكون مناسباً. متابعة؟`))return;
  S.plan[ph][S.ui.planSess].push({ex:id,sets:d.unit==='min'?1:2,reps:d.unit==='sec'?15:d.unit==='min'?5:10});save();render();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'&&el.type==='checkbox'&&e.type==='click'&&false)return;if(el.tagName==='INPUT')return;const f=A[el.dataset.act];if(f)f(el,e)});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.tagName==='INPUT'&&el.type==='checkbox'&&el.dataset.act){A[el.dataset.act](el,e);return}
  if(el.id==='restoreF'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||o.v!==1||!Array.isArray(o.sessions))throw 0;if(!confirm('استبدال البيانات الحالية بالنسخة المختارة؟'))return;localStorage.setItem(KEY,JSON.stringify(o));load();render();toast('تمت الاستعادة.')}catch(x){toast('ملف غير صالح.')}};fr.readAsText(el.files[0]);return}
  bind(el,true);
});
document.addEventListener('input',e=>bind(e.target,false));
function bind(el,isChange){
  const b=el.dataset&&el.dataset.bind;if(!b)return;const f=el.dataset.f;
  if(b==='row'){const r=S.active.exercises[+el.dataset.i].rows[+el.dataset.r];r[f]=el.value;save()}
  else if(b==='fin'){S.ui.fin[f]=el.value;if(f==='rpe'||f==='pain'||f==='control'){const t={rpe:'rpeV',pain:'painV',control:'ctlV'}[f];$('#'+t).textContent=el.value}save()}
  else if(b==='sym'){const s=S.ui.fin.symptoms,k=el.dataset.k;const i=s.indexOf(k);if(el.checked&&i<0)s.push(k);if(!el.checked&&i>=0)s.splice(i,1);save()}
  else if(b==='af'){S.ui.af=S.ui.af||{};S.ui.af[f]=el.value}
  else if(b==='set'){S.settings[f]=el.type==='checkbox'?el.checked:+el.value;if(f==='rest')$('#restV').textContent=el.value;save()}
  else if(b==='progStart'&&isChange&&el.value){S.programStart=el.value;save()}
  else if(b==='chartEx'&&isChange){S.ui.chartEx=el.value;render()}
  else if(b==='plan'&&isChange){
    const p=S.plan[S.ui.planPhase][S.ui.planSess][+el.dataset.i];
    if(el.type==='checkbox')p[f]=el.checked;else{const v=num(el.value);if(f==='repsMax')p[f]=v&&v>p.reps?v:null;else if(v&&v>0)p[f]=Math.round(v)}
    save();render();
  }
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
